plugins {
    id 'com.android.application'
}

android {
    namespace 'com.businessweb.pro'
    compileSdk 35

    defaultConfig {
        applicationId 'com.businessweb.pro'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Business Web Pro v2 verified build trigger.
