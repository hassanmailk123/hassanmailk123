plugins {
    id 'com.android.application'
}

android {
    namespace 'com.businessweb.pro'
    compileSdk 35

    defaultConfig {
        applicationId 'com.businessweb.mobilepro'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '4.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
