name: Build Business Web Pro v3

on:
  push:
    branches: [ main ]
    paths:
      - 'business-web-pro/**'
      - '.github/workflows/business-web-pro-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        working-directory: business-web-pro
        run: gradle --no-daemon clean assembleDebug
      - name: Verify APK
        run: |
          mkdir -p business-web-pro/dist
          cp business-web-pro/app/build/outputs/apk/debug/app-debug.apk business-web-pro/dist/Business-Web-Pro-v3.apk
          unzip -t business-web-pro/dist/Business-Web-Pro-v3.apk
          sha256sum business-web-pro/dist/Business-Web-Pro-v3.apk > business-web-pro/dist/SHA256-v3.txt
          stat -c '%s bytes' business-web-pro/dist/Business-Web-Pro-v3.apk > business-web-pro/dist/SIZE-v3.txt
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Business-Web-Pro-v3
          path: business-web-pro/dist/Business-Web-Pro-v3.apk
          if-no-files-found: error
          retention-days: 1
      - name: Commit APK
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add business-web-pro/dist
          git commit -m "Build Business Web Pro v3 APK [skip ci]" || exit 0
          git push
